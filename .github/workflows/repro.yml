name: Repro

on:
  push:
  workflow_dispatch:

jobs:
  repro:
    name: ${{ matrix.os }} – ${{ matrix.hidden }} hidden, ${{ matrix.svgs }} SVGs${{ matrix.switch && format(', --{0}', matrix.switch) || '' }}${{ matrix.cores && format(', {0} cores', matrix.cores) || '' }}${{ matrix.hogs && format(', {0} hogs', matrix.hogs) || '' }}${{ matrix.hogSeconds && format(' for {0}s', matrix.hogSeconds) || '' }}${{ matrix.flags && ', --single-threaded-gc' || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows 11 client (arm64), 4 cores: background demotion, then the SVG threshold
          - { os: windows-11-arm, hidden: 6, svgs: 30 }
          - { os: windows-11-arm, hidden: 6, svgs: 30, switch: disable-renderer-backgrounding }
          - { os: windows-11-arm, hidden: 6, svgs: 30, switch: disable-features=UseEcoQoSForBackgroundProcess }
          - { os: windows-11-arm, hidden: 4, svgs: 30, switch: disable-features=UseEcoQoSForBackgroundProcess }
          - { os: windows-11-arm, hidden: 2, svgs: 30 }
          - { os: windows-11-arm, hidden: 6, svgs: 8 }
          - { os: windows-11-arm, hidden: 6, svgs: 10 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Run for 15 minutes
        shell: bash
        run: |
          args=(--repro-hidden=${{ matrix.hidden }} --repro-svgs=${{ matrix.svgs }} --repro-seconds=900)
          if [ -n "${{ matrix.flags }}" ]; then args+=(--repro-js-flags=${{ matrix.flags }}); fi
          if [ -n "${{ matrix.cores }}" ]; then args+=(--repro-cores=${{ matrix.cores }}); fi
          if [ -n "${{ matrix.switch }}" ]; then args+=(--repro-switch=${{ matrix.switch }}); fi
          if [ -n "${{ matrix.hogs }}" ]; then args+=(--repro-hogs=${{ matrix.hogs }}); fi
          if [ -n "${{ matrix.hogSeconds }}" ]; then args+=(--repro-hog-seconds=${{ matrix.hogSeconds }}); fi
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a npx electron . --no-sandbox "${args[@]}"
          else
            npx electron . "${args[@]}"
          fi
      - name: Summary
        if: always()
        shell: bash
        run: |
          grep -h ' repro: ' results/*.log >> "$GITHUB_STEP_SUMMARY" || echo 'no verdict' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ strategy.job-index }}
          path: results/
