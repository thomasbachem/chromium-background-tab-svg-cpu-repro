<!doctype html>
<meta charset="utf-8">
<title>loading</title>
<style>
	body { margin: 0; font: 12px sans-serif; }
	.col { display: inline-block; vertical-align: top; width: 120px; }
	.chip { display: block; margin: 1px; padding: 2px; border-radius: 4px; background: #cde; }
	.chip::before { content: ''; display: inline-block; width: 14px; height: 14px; background: currentColor; mask-image: var(--icon); mask-size: 14px; mask-repeat: no-repeat; }
</style>
<script>
	// A page of a real app's size: ~17k nodes, 40k style rules, ~70 MB of JS objects
	// – and N distinct SVG images as CSS masks, one per chip, cycling
	const params = new URLSearchParams(location.search);
	const svgs = Number(params.get('svgs'));
	const icons = Array.from({ length: svgs }, (_, i) => 'url("data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M' + (2 + i % 10) + ' ' + (2 + Math.floor(i / 10) % 10) + 'h' + (12 + i % 7) + 'v' + (12 + i % 5) + 'H' + (2 + i % 10) + 'z"/><circle cx="12" cy="12" r="' + (3 + i % 6) + '" data-i="' + i + '"/></svg>') + '")');

	const rules = [];
	for(let i = 0; i < 40000; i++) {
		rules.push('.r' + i + ' .s' + (i % 97) + ' > span:not(.t' + (i % 13) + ') { color: rgb(' + (i % 255) + ', 0, 0); margin-left: ' + (i % 7) + 'px; }');
	}
	const sheet = new CSSStyleSheet();
	sheet.replaceSync(rules.join('\n'));
	document.adoptedStyleSheets = [sheet];

	window.keep = Array.from({ length: 800000 }, (_, i) => ({ id: i, name: 'item ' + i, tags: [i % 7, i % 11] }));

	addEventListener('DOMContentLoaded', () => {
		for(let c = 0; c < 30; c++) {
			const col = document.createElement('div');
			col.className = 'col s' + (c % 97);
			for(let k = 0; k < 80; k++) {
				const chip = document.createElement('div');
				chip.className = 'chip r' + (c * 80 + k);
				chip.style.setProperty('--icon', icons[(c * 80 + k) % icons.length]);
				chip.innerHTML = '<span class="t1">Event ' + k + '</span> <span>10:00</span>';
				col.append(chip);
			}
			document.body.append(col);
		}
		// Light activity, as a live page keeps – hidden pages throttle it to once a second at most
		setInterval(() => {
			const chip = document.querySelector('.chip:nth-child(' + (1 + Math.floor(Math.random() * 80)) + ')');
			chip.classList.toggle('t3');
			const scrap = document.createElement('div');
			scrap.textContent = 'x'.repeat(100);
			document.body.append(scrap);
			scrap.remove();
		}, 1000);
		// Style and layout forced, so every image loads even in a page that never draws
		document.body.getBoundingClientRect();
		for(const chip of [...document.querySelectorAll('.chip')].slice(0, svgs)) getComputedStyle(chip, '::before').maskImage;
		setTimeout(() => { document.title = 'ready'; }, 500);
	});
</script>
